decoded_frame_root:
- cache/decoded_frames/repcount_notrim/train
val_frame_root:
- cache/decoded_frames/repcount_notrim/test
dataset_root: /workspace/dataset
resize_mode: squash
clip_length: 128
temporal_stride: 1
validation_window_stride: 32
crop_mode: uniform
cycle_jitter: 15
full_video_sampling:
  enabled: false
  fraction: 0.3
  window_stride: null
encoder: videomae
videomae_backbone: MCG-NJU/videomae-base
encoder_pooling: grid
encoder_spatial_grid: 4
encoder_return_intermediate: null
encoder_interp_time: false
freeze_encoder: true
dropout: 0.1
use_dilated_tcn: true
tcn_kernel_size: 5
tcn_dilations:
- 1
- 2
- 4
- 8
- 16
tcn_dim: 1024
spatial_pool: true
use_spatiotemporal: false
spatiotemporal_depth: 2
sigma_factor: 0.4
density_kernel: triangle
lambda_count: 5
lambda_density: 0
lambda_support: 0
count_mode: repcount
use_phase: false
phase_hidden_dim: 512
phase_dropout: null
weight_phase: 1
use_in_repetition: true
in_rep_hidden_dim: 512
in_rep_dropout: null
weight_in_repetition: 3
in_rep_loss_mode: bce
in_rep_focal_alpha: 0.7
in_rep_focal_gamma: 2.0
rate_prediction:
  enabled: false
  reference_length: 128
  loss_weight: 1.0
  mode: smooth_l1
  beta: 1.0
rate_hidden_dim: 512
rate_dropout: null
count_head:
  enabled: false
  mode: per_video
  loss_weight: 1.0
  loss_mode: smooth_l1
  beta: 1.0
  dropout: 0.25
future_prediction:
  enabled: true
  horizon: 12
  loss_weight: 10
  mode: smooth_l1
  smooth_l1_beta: 0.05
  residual: true
  use_velocity: false
outside_repetition_penalty:
  enabled: false
  loss_weight: 1
  tau: 0.05
zero_count_penalty:
  enabled: false
  loss_weight: 0.5
  tolerance: 0.1
  count_threshold: 0.0
use_density: true
batch_size: 8
epochs: 100
learning_rate: 0.0005
weight_decay: 0.0001
num_workers: 8
torch_threads: 8
pin_memory: true
persistent_workers: true
prefetch_factor: 2
grad_clip: 1.0
weighted_sampler: false
weighted_sampler_bin_strategy: width
zero_count_upweight: 1
rate_weighted_sampler: false
rate_weighted_sampler_bin_strategy: width
amp: true
val_every: 3
early_stop_patience: 15
early_stop_min_delta: 0.0
save_dir: ./runs/repcount_notrim_1024tcn
resume: null
random_seed: 42
deterministic: false
log_every: 20
checkpoint: runs/repcount_notrim_1024tcn/last.pt
